[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphoratory"
version = "0.1.0"
description = "Filesystem-first graph laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.16,<2",
  "networkx>=3.4,<4",
  "pandas>=3.0.5",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "structural-graph-lab @ git+https://github.com/hipotures/heg@27cbec9c2307b6ea5f936f858821d11d808b68f3",
  "typer>=0.16,<1",
]

[project.scripts]
graphlab = "graphoratory.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-networkx>=3.4,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphoratory"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/graphoratory"]
exclude = ["src/graphoratory/database/migrations/"]
